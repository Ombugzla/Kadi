<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kadi Games privacy policy and terms of service.">
<meta name="theme-color" content="#e3dac2">
<title>Kadi Games policies</title>
<style>
  :root { color-scheme: light; font: 16px/1.6 system-ui, sans-serif; color: #32281e; background: #f6eedc; }
  body { max-width: 760px; margin: 0 auto; padding: 32px 22px; }
  h1, h2, h3 { line-height: 1.25; }
  h1 { margin: 0 0 16px; }
  a { color: #24633b; }
  .legal { margin: 24px 0; }
  .draft { display: block; padding: 12px; margin: 16px 0; background: #fff2ca; font-weight: 700; }
</style>
</head>
<body>
<p><a href="./about.html">Kadi Games</a></p>
<main id="policy" aria-live="polite">
  <h1>Loading policy…</h1>
</main>
<script type="module">
  import { TERMS, PRIVACY } from './js/legal.js';
  const documentType = new URLSearchParams(location.search).get('document');
  const policy = documentType === 'privacy' ? PRIVACY : documentType === 'terms' ? TERMS : null;
  const heading = documentType === 'privacy' ? 'Privacy Policy' : 'Terms of Service';
  if (policy) {
    document.title = `${heading} | Kadi Games`;
    document.querySelector('#policy').innerHTML = `<h1>${heading}</h1>${policy}`;
  } else {
    document.querySelector('#policy').innerHTML = '<h1>Policy not found</h1><p>Choose the <a href="./legal.html?document=privacy">Privacy Policy</a> or <a href="./legal.html?document=terms">Terms of Service</a>.</p>';
  }
</script>
</body>
</html>
