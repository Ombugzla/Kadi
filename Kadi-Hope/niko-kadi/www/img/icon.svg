<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7a4a"/>
      <stop offset="1" stop-color="#1a4c58"/>
    </linearGradient>
    <pattern id="plaid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="none"/>
      <rect x="0" y="0" width="22" height="64" fill="#f1e8cf" opacity=".07"/>
      <rect x="0" y="0" width="64" height="22" fill="#f1e8cf" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#plaid)"/>
  <!-- back card: king of hearts -->
  <g transform="rotate(14 300 290)">
    <rect x="196" y="96" width="212" height="296" rx="22" fill="#f6efd8" stroke="#00000030" stroke-width="3"/>
    <text x="222" y="158" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#c0352a">K</text>
    <path d="M302 330c-34-26-52-44-52-64a26 26 0 0 1 52-6 26 26 0 0 1 52 6c0 20-18 38-52 64z" fill="#c0352a"/>
  </g>
  <!-- front card: ace of spades -->
  <g transform="rotate(-9 210 300)">
    <rect x="104" y="116" width="228" height="320" rx="24" fill="#fbf7ec" stroke="#00000033" stroke-width="3"/>
    <text x="132" y="186" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#1d1c1a">A</text>
    <path d="M218 380c-34 0-58-22-58-52 0-34 34-58 58-108 24 50 58 74 58 108 0 30-24 52-58 52zm-16 40h32l-16-48z" fill="#1d1c1a"/>
  </g>
  <rect x="0" y="448" width="512" height="64" fill="#e3b23c" opacity=".0"/>
</svg>
