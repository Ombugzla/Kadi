<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kadi Games | Niko Kadi and Special Sequence</title>
<meta name="description" content="Play Niko Kadi and Special Sequence, two Kenyan card games, against computer opponents or online with friends.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div id="app">
  <div id="startupSplash" role="status" aria-live="polite">
    <img class="splash-logo" src="img/quadra-games-splash.png" alt="Kadi Games">
    <p>Loading...</p>
  </div>
  <main id="screen" aria-live="polite"></main>
  <nav id="nav" aria-label="Main">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6.2v-6h5.6v6H21V10.5z"/></svg><span>Home</span></button>
    <button data-tab="rank"><svg viewBox="0 0 24 24"><path d="M4 20h4V11H4zm6 0h4V4h-4zm6 0h4v-6h-4z"/></svg><span>Leaderboard</span></button>
    <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.4 12.2a1.5 1.5 0 0 1-1.5 1.3H6.9a1.5 1.5 0 0 1-1.5-1.3zM8 7a4 4 0 0 1 8 0h-2a2 2 0 0 0-4 0z"/></svg><span>Shop</span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M4 6h16v2.4H4zm0 4.8h16v2.4H4zm0 4.8h16V18H4z"/></svg><span>More</span><span class="badge" id="moreBadge" hidden></span></button>
  </nav>
  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
